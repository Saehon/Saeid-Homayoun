name: JKP bridge synthetic validation

on:
  push:
    paths:
      - 'research-integrations/jkp-global-factors/**'
      - '.github/workflows/jkp-bridge-synthetic-tests.yml'
  pull_request:
    paths:
      - 'research-integrations/jkp-global-factors/**'
      - '.github/workflows/jkp-bridge-synthetic-tests.yml'

permissions:
  contents: read

jobs:
  synthetic-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run local synthetic-only tests
        run: python -m unittest discover -s research-integrations/jkp-global-factors/tests -v
