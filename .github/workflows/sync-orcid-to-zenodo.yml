name: Sync Saeid Homayoun ORCID to Zenodo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "NAAIL-OpenLab/ORCID_SYNC_REQUEST.md"

permissions:
  contents: write

jobs:
  sync-orcid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Zenodo token
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          test -n "$ZENODO_TOKEN" || { echo "::error::Missing ZENODO_TOKEN"; exit 1; }

      - name: Install API client
        run: python -m pip install --disable-pip-version-check requests

      - name: Synchronize ORCID across Zenodo records
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python NAAIL-OpenLab/tools/sync_orcid_to_zenodo.py

      - name: Attach audit report to canonical NAAIL release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f zenodo-orcid-sync.json ]; then
            gh release upload V2026.4-R3 zenodo-orcid-sync.json --clobber
          fi
