name: Codex Portfolio Review

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/CODEX_PORTFOLIO_REVIEW_REQUEST.md"

# Central, read-only Codex audit for public repositories in the Saehon portfolio.
# Private repositories are intentionally excluded because GITHUB_TOKEN is scoped
# to this repository and cannot read other private repositories.

jobs:
  portfolio_review:
    name: Codex Review — Saehon Public Portfolio
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout Saeid-Homayoun
        uses: actions/checkout@v5
        with:
          repository: Saehon/Saeid-Homayoun
          path: portfolio/Saeid-Homayoun
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout AAA
        uses: actions/checkout@v5
        with:
          repository: Saehon/AAA
          path: portfolio/AAA
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout yfinance fork
        uses: actions/checkout@v5
        with:
          repository: Saehon/yfinance
          path: portfolio/yfinance
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Google Antigravity multi-agent BERT
        uses: actions/checkout@v5
        with:
          repository: Saehon/Google-Antigravity-using-a-multi-agent-BERT-architecture
          path: portfolio/Google-Antigravity-using-a-multi-agent-BERT-architecture
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Financial Sentiment models
        uses: actions/checkout@v5
        with:
          repository: Saehon/Financial-Sentiment-Analysis-and-Classification-Deep-Learning-Models
          path: portfolio/Financial-Sentiment-Analysis-and-Classification-Deep-Learning-Models
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout OpenAI banking assistant
        uses: actions/checkout@v5
        with:
          repository: Saehon/agent-openai-python-banking-assistant
          path: portfolio/agent-openai-python-banking-assistant
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout AuditData API
        uses: actions/checkout@v5
        with:
          repository: Saehon/AuditData-API
          path: portfolio/AuditData-API
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Artificial Analysis intelligence index
        uses: actions/checkout@v5
        with:
          repository: Saehon/artificial-analysis-intelligence-index
          path: portfolio/artificial-analysis-intelligence-index
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout IFRS AI Inspector
        uses: actions/checkout@v5
        with:
          repository: Saehon/IFRS-AI-Inspector
          path: portfolio/IFRS-AI-Inspector
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout robosystems
        uses: actions/checkout@v5
        with:
          repository: Saehon/robosystems
          path: portfolio/robosystems
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout ganlab
        uses: actions/checkout@v5
        with:
          repository: Saehon/ganlab
          path: portfolio/ganlab
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout synthetic-data repository
        uses: actions/checkout@v5
        with:
          repository: Saehon/fg-data-synthetic
          path: portfolio/fg-data-synthetic
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout TimesFM fork
        uses: actions/checkout@v5
        with:
          repository: Saehon/timesfm
          path: portfolio/timesfm
          fetch-depth: 1
          persist-credentials: false

      - name: Verify API key is configured
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured." >&2
            exit 1
          fi

      - name: Run Codex portfolio audit
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: portfolio
          permission-profile: ":read-only"
          safety-strategy: "drop-sudo"
          allow-users: "Saehon"
          prompt: |
            Perform a read-only portfolio audit of every repository directory
            under the current `portfolio/` workspace.

            This portfolio supports NAAIL OpenLab research in accounting,
            auditing, assurance, sustainability, economics, scientific AI,
            multi-agent systems, data engineering, and reproducible empirical
            research.

            IMPORTANT SCOPE AND ATTRIBUTION RULES
            - Review every repository directory present in `portfolio/`.
            - Do not edit or create files.
            - Distinguish original/custom NAAIL work from upstream forks,
              imported examples, or external dependencies.
            - Do not attribute upstream code or intellectual property to the
              Saehon/NAAIL portfolio merely because a fork contains NAAIL notes.
            - Treat yfinance and timesfm as upstream forks unless repository
              evidence establishes a separate custom component.
            - For other repositories, state uncertainty where provenance is not
              clear from repository evidence.

            FOR EACH REPOSITORY, REVIEW
            1. Purpose and relationship to NAAIL.
            2. Repository hygiene: README, license, citation, contributing,
               changelog, AGENTS.md, dependency files, ignored/generated files.
            3. Code structure and maintainability.
            4. Tests and CI coverage.
            5. Security: credentials, unsafe examples, dependency risks,
               sensitive/private/proprietary data exposure.
            6. Reproducibility: seeds, environments, data provenance,
               deterministic pipelines, versioning, notebooks vs reusable code.
            7. Research-method risks: look-ahead bias, temporal leakage,
               train/test contamination, unsupported causal claims, weak
               validation, data licensing/provenance concerns.
            8. Accounting/audit domain risks where applicable: IFRS/PCAOB/SEC
               provenance, standard-version dating, CAM/KAM fiscal-period
               alignment, ICFR labels, XBRL mappings, evidence traceability.
            9. Codex readiness: whether AGENTS.md and automated review are
               appropriate and what governance should apply.
            10. Whether the repo should be classified as CORE PRODUCT,
                RESEARCH PROJECT, EDUCATION/DEMO, DATA/DEPENDENCY, UPSTREAM FORK,
                ARCHIVE, or CONSOLIDATE/RETIRE.

            PORTFOLIO-WIDE CHECKS
            - duplicated NAAIL documentation across repos
            - conflicting product names or architecture descriptions
            - unclear canonical source of truth
            - duplicate or stale repositories
            - inconsistent licensing/citation/IP claims
            - fork attribution risks
            - missing tests and CI
            - inconsistent default branches
            - opportunities to consolidate reusable components
            - whether NAAIL OpenLab remains the umbrella architecture
            - whether KIWI, POMELO, VERA, ECONOVA-S, IFRS Agent, PCAOB Agent,
              ICFR/TimesFM, Research Lab, Audit Agent Lab, and Student Lab are
              represented consistently as specialist modules rather than
              competing top-level platforms

            Produce a professional report with this exact structure:

            # Codex Portfolio Review — Saehon / NAAIL
            ## Executive verdict
            ## Critical findings
            ## Repository-by-repository matrix
            ## Security and data-governance findings
            ## Reproducibility and research-integrity findings
            ## Architecture and product-governance findings
            ## Fork/provenance and licensing findings
            ## Codex/CI readiness
            ## Top 10 prioritized actions
            ## Repositories to keep, consolidate, archive, or treat as dependencies
            ## Final verdict

            Prioritize evidence from actual repository files over assumptions.
            Cite concrete file paths when possible. Be concise but substantive.

  publish_review:
    name: Publish Codex Portfolio Review
    runs-on: ubuntu-latest
    needs: portfolio_review
    if: needs.portfolio_review.outputs.final_message != ''

    permissions:
      issues: write

    steps:
      - name: Publish review as GitHub issue
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ needs.portfolio_review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_REVIEW || 'Codex returned no review text.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Codex Portfolio Review — ${new Date().toISOString().slice(0, 10)}`,
              body: body.slice(0, 65000),
              labels: [],
            });
