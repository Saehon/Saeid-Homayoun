name: Publish Dr. Saeid Homayoun AuditBERT V2 to Hugging Face

on:
  push:
    branches:
      - research/saeid-auditbert-v2-20261016
      - main
    paths:
      - "huggingface/spaces/dr-saeid-homayoun-auditbert-v2/**"
      - "huggingface/models/saeid-finbert-kam-v2/**"
      - "huggingface/models/saeid-llama-31-8b-kam-v2/**"
      - ".github/workflows/hf-saeid-auditbert-v2-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-saeid-auditbert-v2-hf-publish
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate public synthetic-safe demonstration
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s huggingface/spaces/dr-saeid-homayoun-auditbert-v2 \
            -p "test_*.py" -v
          python -m py_compile \
            huggingface/spaces/dr-saeid-homayoun-auditbert-v2/app.py \
            huggingface/spaces/dr-saeid-homayoun-auditbert-v2/topic_screening.py

      - name: Check static JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("huggingface/spaces/dr-saeid-homayoun-auditbert-v2/index.html").read_text(encoding="utf-8")
          if page.count("<script>") != 1 or page.count("</script>") != 1:
              raise SystemExit("Expected exactly one inline JavaScript block")
          code = page.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/saeid_auditbert_static.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/saeid_auditbert_static.js

      - name: Verify configured Hugging Face repository write credentials
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "::error::HF_TOKEN missing. Configure a write-scoped token for account SADHON as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Publish FREE static research demonstration and PRIVATE model placeholders
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          account = api.whoami().get("name", "")
          if account.lower() != "sadhon":
              raise RuntimeError(
                  "Connected Hugging Face token does not belong to the expected SADHON account."
              )

          root = "huggingface/spaces/dr-saeid-homayoun-auditbert-v2"
          space_id = "SADHON/dr-saeid-homayoun-auditbert-v2"
          api.create_repo(
              repo_id=space_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              folder_path=root,
              repo_id=space_id,
              repo_type="space",
              allow_patterns=["index.html", "README.md"],
              commit_message="Publish Dr. Saeid Homayoun free static CAM/KAM demonstrator",
          )
          print(f"Space publication requested: https://huggingface.co/spaces/{space_id}")

          for name in ("saeid-finbert-kam-v2", "saeid-llama-31-8b-kam-v2"):
              model_id = "SADHON/" + name
              api.create_repo(
                  repo_id=model_id,
                  repo_type="model",
                  private=True,
                  exist_ok=True,
              )
              api.upload_folder(
                  folder_path="huggingface/models/" + name,
                  repo_id=model_id,
                  repo_type="model",
                  commit_message="Private untrained model-card staging: Dr. Saeid Homayoun",
              )
              print(f"Private MODEL CARD ONLY (no weights): {model_id}")

          print("No Google Drive observations or pretrained weights were uploaded.")
          PY
