name: Publish Accounting Audit AI Portfolio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "portfolio/accounting-audit-ai-portfolio/**"
      - "huggingface/datasets/accounting-audit-ai-portfolio/**"
      - "kaggle/datasets/accounting-audit-ai-portfolio/**"
      - "kaggle/notebooks/accounting-audit-ai-portfolio/**"
      - ".github/workflows/publish-accounting-audit-ai-portfolio.yml"

permissions:
  contents: read

concurrency:
  group: publish-accounting-audit-ai-portfolio
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate portfolio
        run: |
          python - <<'PY'
          import csv
          p="portfolio/accounting-audit-ai-portfolio/portfolio.csv"
          with open(p, newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          required={"priority","asset","platform","url","domain","role","status"}
          assert rows, "portfolio.csv is empty"
          assert required.issubset(rows[0].keys())
          assert len(rows) >= 10
          assert all(r["url"].startswith("https://") for r in rows)
          for r in rows[:10]:
              print(r["priority"], r["asset"], r["platform"])
          PY

      - name: Detect credentials
        id: creds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          [[ -n "${HF_TOKEN}" ]] && echo "hf=true" >> "${GITHUB_OUTPUT}" || echo "hf=false" >> "${GITHUB_OUTPUT}"
          [[ -n "${KAGGLE_API_TOKEN}" ]] && echo "kaggle=true" >> "${GITHUB_OUTPUT}" || echo "kaggle=false" >> "${GITHUB_OUTPUT}"

      - name: Install publishers
        if: steps.creds.outputs.hf == 'true' || steps.creds.outputs.kaggle == 'true'
        run: python -m pip install --quiet --upgrade huggingface_hub kaggle

      - name: Publish Hugging Face portfolio
        if: steps.creds.outputs.hf == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf /tmp/hf-portfolio
          mkdir -p /tmp/hf-portfolio
          cp huggingface/datasets/accounting-audit-ai-portfolio/README.md /tmp/hf-portfolio/README.md
          cp portfolio/accounting-audit-ai-portfolio/portfolio.csv /tmp/hf-portfolio/
          cp portfolio/accounting-audit-ai-portfolio/README.md /tmp/hf-portfolio/README_GITHUB.md
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo_id="SADHON/accounting-audit-ai-portfolio"
          api=HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=repo_id, repo_type="dataset", private=False, exist_ok=True)
          api.upload_folder(repo_id=repo_id, repo_type="dataset", folder_path="/tmp/hf-portfolio",
                            commit_message=f"Sync Accounting & Audit AI Portfolio {os.environ.get('GITHUB_SHA','')}")
          print(f"https://huggingface.co/datasets/{repo_id}")
          PY

      - name: Publish Kaggle portfolio dataset
        if: steps.creds.outputs.kaggle == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          rm -rf /tmp/kaggle-portfolio
          mkdir -p /tmp/kaggle-portfolio
          cp kaggle/datasets/accounting-audit-ai-portfolio/dataset-metadata.json /tmp/kaggle-portfolio/
          cp kaggle/datasets/accounting-audit-ai-portfolio/README.md /tmp/kaggle-portfolio/
          cp portfolio/accounting-audit-ai-portfolio/portfolio.csv /tmp/kaggle-portfolio/
          dataset="sadhon/accounting-audit-ai-portfolio"
          if kaggle datasets files "${dataset}" >/dev/null 2>&1; then
            kaggle datasets version -p /tmp/kaggle-portfolio -m "Portfolio sync ${GITHUB_SHA}"
          else
            kaggle datasets create -p /tmp/kaggle-portfolio --public
          fi

      - name: Publish Kaggle Start Here notebook
        if: steps.creds.outputs.kaggle == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          rm -rf /tmp/kaggle-kernel
          mkdir -p /tmp/kaggle-kernel
          cp kaggle/notebooks/accounting-audit-ai-portfolio/accounting-audit-ai-portfolio.ipynb /tmp/kaggle-kernel/
          cp kaggle/notebooks/accounting-audit-ai-portfolio/kernel-metadata.json /tmp/kaggle-kernel/
          kaggle kernels push -p /tmp/kaggle-kernel
