name: Scientific Discovery Protocol

on:
  push:
    paths:
      - "GOOGLE_INSPIRED_DISCOVERY_PROTOCOL.md"
      - "ARCHITECTURE.md"
      - "SCIENTIFIC_ASSURANCE.md"
      - "REPRODUCIBILITY.md"
      - "AI_TO_AI_AUTOMATION.md"
      - "discovery/**"
      - "templates/STUDY_DISCOVERY_TEMPLATE.md"
      - ".github/workflows/scientific_discovery_protocol.yml"
  pull_request:
    paths:
      - "GOOGLE_INSPIRED_DISCOVERY_PROTOCOL.md"
      - "ARCHITECTURE.md"
      - "SCIENTIFIC_ASSURANCE.md"
      - "REPRODUCIBILITY.md"
      - "AI_TO_AI_AUTOMATION.md"
      - "discovery/**"
      - "templates/STUDY_DISCOVERY_TEMPLATE.md"
      - ".github/workflows/scientific_discovery_protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-discovery-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --upgrade pytest jsonschema
      - name: Compile discovery validator
        run: python -m py_compile discovery/validate_study_manifest.py
      - name: Validate canonical sample study manifest
        run: python discovery/validate_study_manifest.py discovery/sample_study_manifest.json
      - name: Run discovery-governance tests
        run: python -m pytest -q discovery/test_discovery_manifest.py
      - name: Validate machine-readable scientific constitution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from discovery.validate_study_manifest import (
              INTEGRITY_REQUIRED_FOR_DISCOVERY,
              MANDATORY_FOR_DISCOVERY,
          )

          constitution = json.loads(
              Path("discovery/scientific_constitution.json").read_text(encoding="utf-8")
          )
          invariants = constitution["invariants"]

          assert invariants["agent_consensus_is_scientific_truth"] is False
          assert invariants["optimize_for_p_value"] is False
          assert invariants["discovery_claim_default"] is False
          assert invariants["human_gate_required"] is True
          assert invariants["failed_and_null_results_must_be_retained"] is True
          assert invariants["protocol_relaxation_by_agent_allowed"] is False
          assert invariants["external_system_names_imply_execution"] is False
          assert invariants["review_role_separation_alone_counts_as_independence"] is False
          assert invariants["evidence_lineage_required"] is True
          assert invariants["holdout_leakage_allowed"] is False

          assert set(constitution["minimum_discovery_gates"]) == set(MANDATORY_FOR_DISCOVERY)
          assert set(constitution["mandatory_integrity_controls"]) == set(INTEGRITY_REQUIRED_FOR_DISCOVERY)
          assert constitution["final_authority"] == "human_reviewer"
          print("Scientific constitution matches executable validator.")
          PY
      - name: Enforce canonical scientific invariants in narrative governance
        run: |
          python - <<'PY'
          from pathlib import Path
          protocol = Path("GOOGLE_INSPIRED_DISCOVERY_PROTOCOL.md").read_text(encoding="utf-8")
          assurance = Path("SCIENTIFIC_ASSURANCE.md").read_text(encoding="utf-8")
          automation = Path("AI_TO_AI_AUTOMATION.md").read_text(encoding="utf-8")
          required = [
              "Co-Scientist",
              "ERA",
              "AlphaEvolve",
              "Computational Discovery",
              "AlphaFold",
              "Chain-of-Evidence",
              "CoE Audit",
              "Human Gate",
              "discovery_claim_allowed = false",
          ]
          joined = "\n".join([protocol, assurance, automation])
          missing = [x for x in required if x not in joined]
          assert not missing, f"Missing canonical discovery controls: {missing}"
          assert "agent_consensus != scientific_truth" in automation
          print("Narrative scientific discovery governance invariants present.")
          PY
