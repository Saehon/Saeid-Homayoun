name: Kaggle Sync

on:
  workflow_dispatch:
    inputs:
      create_public_datasets:
        description: "Allow creation of new public Kaggle datasets"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "kaggle/**"
      - "open-data/microsoft-demo-001/**"
      - "open-data/cam-kam-auditbert-demo-001/**"
      - ".github/workflows/kaggle-sync.yml"

permissions:
  contents: read

concurrency:
  group: kaggle-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check Kaggle authentication
        id: auth
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${KAGGLE_API_TOKEN}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::KAGGLE_API_TOKEN is not configured. Kaggle sync is skipped until the repository secret is added."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.auth.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        if: steps.auth.outputs.configured == 'true'
        run: python -m pip install --upgrade kaggle

      - name: Validate canonical CAM/KAM demo
        if: steps.auth.outputs.configured == 'true'
        run: python open-data/cam-kam-auditbert-demo-001/validate.py

      - name: Stage canonical Microsoft dataset
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p kaggle/datasets/microsoft-accounting-demo
          cp open-data/microsoft-demo-001/microsoft_financials.csv kaggle/datasets/microsoft-accounting-demo/
          cp open-data/microsoft-demo-001/provenance.json kaggle/datasets/microsoft-accounting-demo/

      - name: Stage canonical CAM/KAM AuditBERT dataset
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p kaggle/datasets/cam-kam-auditbert-public-demo
          cp open-data/cam-kam-auditbert-demo-001/synthetic_cam_kam_sample.csv kaggle/datasets/cam-kam-auditbert-public-demo/
          cp open-data/cam-kam-auditbert-demo-001/provenance.json kaggle/datasets/cam-kam-auditbert-public-demo/

      - name: Sync notebooks and datasets to Kaggle
        if: steps.auth.outputs.configured == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_CREATE_PUBLIC: ${{ github.event.inputs.create_public_datasets || 'false' }}
          KAGGLE_VERSION_MESSAGE: "GitHub sync ${{ github.sha }}"
        run: bash kaggle/scripts/sync_kaggle.sh kaggle

      - name: Verify Kaggle finance model execution
        if: steps.auth.outputs.configured == 'true'
        timeout-minutes: 10
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          kernel="sadhon/finance-sentiment-model-microsoft-sec-example"
          for attempt in {1..45}; do
            status="$(kaggle kernels status "$kernel")"
            echo "$status"
            if grep -Eiq 'complete(d)?' <<< "$status"; then
              mkdir -p /tmp/kaggle-finance-model-check
              kaggle kernels output "$kernel" -p /tmp/kaggle-finance-model-check \
                --file-pattern 'model_metrics.json' -o
              python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/kaggle-finance-model-check/model_metrics.json')
          result = json.loads(path.read_text())
          assert result['split_counts']['test']['clean_rows'] > 0
          print('Kaggle test macro-F1:', result['test']['model']['macro_f1'])
          PY
              exit 0
            fi
            if grep -Eiq 'error|failed|cancell?ed' <<< "$status"; then
              echo 'Kaggle model execution failed.' >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Kaggle model execution did not finish within 7.5 minutes.' >&2
          exit 1
