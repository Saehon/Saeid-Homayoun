name: NAAIL Platform Capability Guard

on:
  push:
    branches: [main]
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail_platform_capability_guard.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail_platform_capability_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Validate platform capability registry
        run: pytest -q NAAIL-OpenLab/tests/test_platform_capability_registry.py
