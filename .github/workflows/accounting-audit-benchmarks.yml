name: Accounting Audit Finance Benchmarks

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/accounting-audit-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run zero-dependency benchmark smoke tests
        run: python benchmarks/run_benchmarks.py
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: accounting-audit-finance-smoke-results
          path: benchmarks/results/smoke-results.json
          retention-days: 7
