# Phase 2 registered trigger
name: SEC 10-Company Accounting Phase 2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sec_10_company_phase2.yml"

permissions:
  contents: write

concurrency:
  group: sec-10-company-phase2
  cancel-in-progress: false

jobs:
  refresh-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh 10-company panel from SEC CompanyFacts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Saeid-Homayoun-Open-Accounting-Research saehon@users.noreply.github.com' }}
        run: python open-data/sec-10-company-phase2/fetch_sec_panel.py

      - name: Validate canonical Phase-2 panel
        run: python open-data/sec-10-company-phase2/validate.py

      - name: Build latest-period accounting summary
        run: python open-data/sec-10-company-phase2/analysis.py

      - name: Test free deterministic accounting agent
        run: |
          python open-data/sec-10-company-phase2/agent.py profile MSFT
          python open-data/sec-10-company-phase2/agent.py compare MSFT AAPL
          python open-data/sec-10-company-phase2/agent.py quality

      - name: Install distribution clients
        if: ${{ secrets.KAGGLE_API_TOKEN != '' || secrets.HF_TOKEN != '' }}
        run: python -m pip install --upgrade kaggle huggingface_hub

      - name: Publish or version Kaggle dataset
        if: ${{ secrets.KAGGLE_API_TOKEN != '' }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kaggle-phase2
          mkdir -p /tmp/kaggle-phase2
          cp kaggle/datasets/sec-10-company-accounting-panel/dataset-metadata.json /tmp/kaggle-phase2/
          cp kaggle/datasets/sec-10-company-accounting-panel/README.md /tmp/kaggle-phase2/
          cp open-data/sec-10-company-phase2/sec_10_company_panel.csv /tmp/kaggle-phase2/
          cp open-data/sec-10-company-phase2/phase2_summary.csv /tmp/kaggle-phase2/
          cp open-data/sec-10-company-phase2/sec_refresh_manifest.json /tmp/kaggle-phase2/
          dataset="sadhon/sec-10-company-accounting-panel"
          kaggle datasets list -m -p 1 >/dev/null
          if kaggle datasets files "$dataset" >/dev/null 2>&1; then
            kaggle datasets version -p /tmp/kaggle-phase2 -m "Automated SEC refresh ${GITHUB_SHA}"
          else
            # New Phase-2 Kaggle datasets start private. Visibility can be changed
            # after the first validated version without changing the canonical pipeline.
            kaggle datasets create -p /tmp/kaggle-phase2
          fi

      - name: Publish or version Hugging Face dataset
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hf-phase2
          mkdir -p /tmp/hf-phase2
          cp huggingface/datasets/sec-10-company-accounting-panel/README.md /tmp/hf-phase2/README.md
          cp open-data/sec-10-company-phase2/sec_10_company_panel.csv /tmp/hf-phase2/
          cp open-data/sec-10-company-phase2/phase2_summary.csv /tmp/hf-phase2/
          cp open-data/sec-10-company-phase2/sec_refresh_manifest.json /tmp/hf-phase2/
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "SADHON/sec-10-company-accounting-panel"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(
              repo_id=repo_id,
              repo_type="dataset",
              private=False,
              exist_ok=True,
          )
          result = api.upload_folder(
              repo_id=repo_id,
              repo_type="dataset",
              folder_path="/tmp/hf-phase2",
              commit_message="Automated SEC 10-company accounting refresh",
          )
          print(result)
          print(f"Published https://huggingface.co/datasets/{repo_id}")
          PY

      - name: Commit refreshed canonical outputs to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             open-data/sec-10-company-phase2/sec_10_company_panel.csv             open-data/sec-10-company-phase2/phase2_summary.csv             open-data/sec-10-company-phase2/sec_refresh_manifest.json
          if git diff --cached --quiet; then
            echo "No canonical data changes to commit."
          else
            git commit -m "data: refresh SEC 10-company Phase 2 panel"
            git push
          fi

      - name: Upload reproducibility package
        uses: actions/upload-artifact@v4
        with:
          name: sec-10-company-accounting-phase2
          path: |
            open-data/sec-10-company-phase2/companies.json
            open-data/sec-10-company-phase2/sec_10_company_panel.csv
            open-data/sec-10-company-phase2/phase2_summary.csv
            open-data/sec-10-company-phase2/sec_refresh_manifest.json
            open-data/sec-10-company-phase2/README.md
            open-data/sec-10-company-phase2/agent.py
          if-no-files-found: error
