name: LEMON-SCI ACK2007 Compiler Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Lemon-ICFR-US/research/scientific-compute-reuse/**'
      - '.github/workflows/lemon-sci-ack2007-tests.yml'
  push:
    branches:
      - feature/lemon-scientific-compute-reuse
    paths:
      - 'Lemon-ICFR-US/research/scientific-compute-reuse/**'
      - '.github/workflows/lemon-sci-ack2007-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lemon-ICFR-US/research/scientific-compute-reuse/executable-models/ACK2007
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - run: pytest -q
      - name: Execute frozen fixtures and checksum
        run: python ../../verification/ACK2007/run_fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: ack2007-frozen-fixture-results
          path: |
            Lemon-ICFR-US/research/scientific-compute-reuse/executable-models/ACK2007/fixture-results.json
            Lemon-ICFR-US/research/scientific-compute-reuse/executable-models/ACK2007/fixture-results.sha256
