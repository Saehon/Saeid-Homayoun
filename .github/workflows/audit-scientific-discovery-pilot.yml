name: Audit Scientific Discovery synthetic pilot
on:
  push:
    paths:
      - 'NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent/**'
      - '.github/workflows/audit-scientific-discovery-pilot.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent/**'
      - '.github/workflows/audit-scientific-discovery-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (synthetic, no network)
        working-directory: NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Run fixed synthetic demonstration
        working-directory: NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent
        run: python pilot.py --demo --out results/pilot_results.json
      - name: Run actual Lemon + CAM synthetic integration
        working-directory: NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent
        run: python integrated_case.py --case-id SYN-2024-00 --out results/integrated_evidence_passport.json
      - name: Run author-data rights gate without upstream files
        working-directory: NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent
        run: python bao_replication_gateway.py --source-dir /tmp/bao-author-not-mounted --out results/bao_replication_gate.json
      - name: Assert scientific gate stays closed
        working-directory: NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent
        run: |
          python -c "import json; r=json.load(open('results/pilot_results.json')); assert not r['scientific_discovery_claim_allowed']; assert r['human_approval_status']=='REQUIRED_NOT_GRANTED'; assert r['not_bao_replication']"
      - name: Assert integrated output requires human approval and author gate is dry-run
        working-directory: NAAIL-OpenLab/research/audit-scientific-discovery-paper2agent
        run: |
          python -c "import json; r=json.load(open('results/integrated_evidence_passport.json')); assert r['lemon_status']=='AWAITING_HUMAN_APPROVAL'; assert not r['human_approval_granted']; assert not r['scientific_discovery_claim_allowed']"
          python -c "import json; r=json.load(open('results/bao_replication_gate.json')); assert r['execution']['status']=='DRY_RUN_ONLY'; assert not r['all_original_code_blobs_match']"
