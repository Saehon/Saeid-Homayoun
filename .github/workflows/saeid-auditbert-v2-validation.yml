name: Dr. Saeid Homayoun AuditBERT V2 - research integrity smoke test

on:
  push:
    paths:
      - "research/saeid-homayoun-auditbert-v2/**"
      - ".github/workflows/saeid-auditbert-v2-validation.yml"
  pull_request:
    paths:
      - "research/saeid-homayoun-auditbert-v2/**"
      - ".github/workflows/saeid-auditbert-v2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-schema-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema-only dependencies
        run: python -m pip install pandas numpy scikit-learn openpyxl
      - name: Verify synthetic schema without training or uploading
        run: |
          python research/saeid-homayoun-auditbert-v2/train_finbert_topic.py \
            --input research/cam-kam-auditbert-maryam/synthetic_cam_kam_sample.csv \
            --dry-run > /tmp/saeid_auditbert_dry_run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/saeid_auditbert_dry_run.json').read_text())
          assert result["status"] == "SCHEMA_ONLY_NO_TRAINING"
          assert result["cleaned_rows"] == 3
          assert result["topic_count"] == 3
          assert result["sample_is_trained"] is False
          print("PASS: schema integrity; model training/publication not claimed")
          PY
      - name: Validate independent company holdout guard
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path("research/saeid-homayoun-auditbert-v2/train_finbert_topic.py")
          spec = importlib.util.spec_from_file_location("auditbert_v2", p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          frame, _ = m.prepare_table(
              Path("research/cam-kam-auditbert-maryam/synthetic_cam_kam_sample.csv"))
          try:
              m.holdouts(frame, "company", None, 42)
          except ValueError as e:
              assert "At least 5" in str(e)
          else:
              raise AssertionError("Three synthetic companies cannot support publication-grade holdouts")
          print("PASS: undersized grouped split is rejected")
          PY

      - name: Verify Llama-response dataset schema with no GPU or training
        run: |
          python research/saeid-homayoun-auditbert-v2/train_llama_response_qlora.py \
            --input research/cam-kam-auditbert-maryam/synthetic_cam_kam_sample.csv \
            --dry-run > /tmp/saeid_llama_dry_run.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/saeid_llama_dry_run.json").read_text())
          assert result["status"] == "SCHEMA_ONLY_NOT_TRAINED"
          assert result["response_rows"] == 3
          print("PASS: generator input schema only; no model weights created")
          PY

      - name: Read-only large-corpus preflight synthetic self-test
        run: |
          python research/saeid-homayoun-auditbert-v2/large_corpus_preflight.py --self-test

      - name: Real-corpus training code synthetic end-to-end test
        run: |
          python research/saeid-homayoun-auditbert-v2/real_corpus_tfidf.py --self-test


      - name: Validate Colab notebook JSON and Python cell syntax only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/saeid-homayoun-auditbert-v2/AuditBERT_USUK_Drive_Colab.ipynb")
          nb = json.loads(p.read_text(encoding="utf-8"))
          assert nb["nbformat"] == 4
          codes = [c for c in nb["cells"] if c["cell_type"] == "code"]
          assert len(codes) >= 5
          for i, cell in enumerate(codes):
              compile("".join(cell["source"]), f"<colab-cell-{i}>", "exec")
          rendered = p.read_text(encoding="utf-8")
          assert "AUTHORIZED_PRIVATE_SOURCE_USE = False" in rendered
          assert "OLD_NOTEBOOK_HF_TOKENS_REVOKED = False" in rendered
          assert "RUN_GPU_FINBERT = False" in rendered
          print("PASS: schema, code syntax, and explicit security/compute stop gates; GPU not executed")
          PY
