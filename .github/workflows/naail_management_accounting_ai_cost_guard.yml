name: NAAIL Management Accounting AI Cost Guard

on:
  push:
    paths:
      - 'NAAIL-OpenLab/TWO_CORE_CONSTITUTION.md'
      - 'NAAIL-OpenLab/MANAGEMENT_ACCOUNTING_AI_COST_INTELLIGENCE_LAYER.md'
      - 'NAAIL-OpenLab/OPEN_MODEL_BENCHMARK_COST_INTELLIGENCE_LAYER.md'
      - 'NAAIL-OpenLab/VISUALIZATION_DECISION_INTELLIGENCE_LAYER.md'
      - 'NAAIL-OpenLab/architecture/MASTER_PLATFORM_HIERARCHY.md'
      - 'NAAIL-OpenLab/architecture/platform_capability_registry.json'
      - 'NAAIL-OpenLab/tests/test_management_accounting_ai_cost_layer.py'
      - '.github/workflows/naail_management_accounting_ai_cost_guard.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/TWO_CORE_CONSTITUTION.md'
      - 'NAAIL-OpenLab/MANAGEMENT_ACCOUNTING_AI_COST_INTELLIGENCE_LAYER.md'
      - 'NAAIL-OpenLab/OPEN_MODEL_BENCHMARK_COST_INTELLIGENCE_LAYER.md'
      - 'NAAIL-OpenLab/VISUALIZATION_DECISION_INTELLIGENCE_LAYER.md'
      - 'NAAIL-OpenLab/architecture/MASTER_PLATFORM_HIERARCHY.md'
      - 'NAAIL-OpenLab/architecture/platform_capability_registry.json'
      - 'NAAIL-OpenLab/tests/test_management_accounting_ai_cost_layer.py'
  workflow_dispatch:

jobs:
  constitution-and-cost-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify frozen two-core and management-accounting placement
        run: pytest -q NAAIL-OpenLab/tests/test_management_accounting_ai_cost_layer.py
