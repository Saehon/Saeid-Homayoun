name: Scientific Python Reproducibility
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/scientific-python-reproducibility.yml'
  push:
    branches: ['main', 'research/**']
    paths:
      - 'research/**'
      - '.github/workflows/scientific-python-reproducibility.yml'
permissions:
  contents: read
jobs:
  synthetic-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q research/ai_evidence_evaluation
      - name: Test evidence-scoring contract and failure cases
        run: python -m unittest discover -s research/ai_evidence_evaluation/tests -p 'test_*.py' -v
      - name: Reproduce documented synthetic evaluation
        run: |
          python -m research.ai_evidence_evaluation.evaluate --out reports/scientific_ai_synthetic.json
          python -c 'import json; d=json.load(open("reports/scientific_ai_synthetic.json")); assert d["summary"]["n"] == 5; assert d["scope"] == "deterministic synthetic_contract_validation"'
      - name: Reproduce synthetic paired comparison and verify evidence state
        run: |
          python -m research.ai_evidence_evaluation.compare_runs --out reports/scientific_ai_synthetic_comparison.json
          python -c 'import json; d=json.load(open("reports/scientific_ai_synthetic_comparison.json")); assert d["reference_count"] == 5 and len(d["run_summaries"]) == 2; assert d["empirical_model_benchmark"] is False and d["independent_gold_validation"] is False'
      - name: Validate declared model-run provenance, digest and synthetic evidence status
        run: |
          python -m research.ai_evidence_evaluation.validate_run --out reports/scientific_ai_synthetic_provenance.json
          python -c 'import json; d=json.load(open("reports/scientific_ai_synthetic_provenance.json")); assert d["records_checked"]==2 and d["source_type"]=="synthetic_fixture"; assert d["model_performance_claim_permitted"] is False and d["independent_validation_status"]=="NOT_VERIFIED"'
      - name: Validate simulated reviewer agreement and adjudication controls
        run: |
          python -m research.ai_evidence_evaluation.annotation_audit --out reports/scientific_ai_synthetic_annotation_audit.json
          python -c 'import json; d=json.load(open("reports/scientific_ai_synthetic_annotation_audit.json")); s=d["summary"]; assert s["n_cases"] == 5 and s["n_reviewer_records"] == 10 and s["n_adjudicated"] == 1; assert d["actual_independent_human_review_verified"] is False and d["model_evaluation_completed"] is False'
      - name: Validate scholarly DOI records and Harvard citation formatting
        run: |
          python -m compileall -q research/literature
          python -m unittest discover -s research/literature/tests -p 'test_*.py' -v
          python -m research.literature.harvard_crossref --out reports/harvard_bibliography_offline.json
          python -c 'import json; p=json.load(open("reports/harvard_bibliography_offline.json")); assert p["records_total"] >= 20 and p["crossref_api_accessed"] is False and p["no_claim_of_exhaustiveness"] is True; assert p["api_metadata_match_count"] == 0'
      - name: Enforce Harvard citation and project scientific evidence gates
        run: |
          python -m research.literature.evidence_quality_gate --out reports/scholarly_claim_integrity_offline.json
          python -c 'import json; p=json.load(open("reports/scholarly_claim_integrity_offline.json")); assert p["bibliographic_records"] == p["public_harvard_references"] and p["tracked_project_claims"] >= 10; assert p["all_project_hypotheses_empirically_supported"] is False and p["official_ajg_ranking_verified"] is False and p["bibliographic_metadata_verified_against_publisher_api"] is False'
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientific-ai-synthetic-evaluation
          path: |
            reports/scientific_ai_synthetic*.json
            reports/harvard_bibliography_offline.json
            reports/scholarly_claim_integrity_offline.json
          retention-days: 30
          if-no-files-found: error
