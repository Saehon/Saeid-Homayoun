name: Publish CAM-KAM AuditBERT Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: research/cam-kam-auditbert-maryam
      HF_REPO_ID: SADHON/cam-kam-auditbert-public-demo
      KAGGLE_DATASET_ID: sadhon/cam-kam-auditbert-public-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$PACKAGE_DIR/requirements.txt"
          pip install huggingface_hub kaggle

      - name: Validate synthetic dataset
        run: |
          python "$PACKAGE_DIR/prepare_cam_kam_data.py" \
            --input "$PACKAGE_DIR/synthetic_cam_kam_sample.csv" \
            --output "$PACKAGE_DIR/prepared_demo"

      - name: Prepare Hugging Face folder
        run: |
          rm -rf hf_publish
          mkdir hf_publish
          cp "$PACKAGE_DIR/synthetic_cam_kam_sample.csv" hf_publish/
          cp "$PACKAGE_DIR/prepare_cam_kam_data.py" hf_publish/
          cp "$PACKAGE_DIR/requirements.txt" hf_publish/
          cp "$PACKAGE_DIR/DATA_SCHEMA.md" hf_publish/
          cp "$PACKAGE_DIR/README_HUGGINGFACE.md" hf_publish/README.md
          cp -r "$PACKAGE_DIR/prepared_demo" hf_publish/prepared_demo

      - name: Publish Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo

          repo_id = os.environ["HF_REPO_ID"]
          token = os.environ["HF_TOKEN"]

          create_repo(
              repo_id=repo_id,
              repo_type="dataset",
              private=True,
              exist_ok=True,
              token=token,
          )
          HfApi(token=token).upload_folder(
              repo_id=repo_id,
              repo_type="dataset",
              folder_path="hf_publish",
              commit_message="Publish CAM/KAM AuditBERT public demo",
          )
          PY

      - name: Publish Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if kaggle datasets status "$KAGGLE_DATASET_ID" >/dev/null 2>&1; then
            kaggle datasets version \
              -p "$PACKAGE_DIR" \
              -m "Update CAM/KAM AuditBERT public demo" \
              -q -t -r skip
          else
            kaggle datasets create \
              -p "$PACKAGE_DIR" \
              -q -t -r skip
          fi
