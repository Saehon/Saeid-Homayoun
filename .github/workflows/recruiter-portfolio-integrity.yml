name: Recruiter Portfolio Integrity
on:
  push:
    branches: ['portfolio/**']
    paths:
      - 'portfolio/recruiter-hub/**'
      - '.github/workflows/recruiter-portfolio-integrity.yml'
  pull_request:
    paths:
      - 'portfolio/recruiter-hub/**'
      - '.github/workflows/recruiter-portfolio-integrity.yml'
permissions:
  contents: read
jobs:
  offline-doc-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile portfolio scripts
        run: python -m compileall -q portfolio/recruiter-hub
      - name: Check documented evidence and internal links
        run: python portfolio/recruiter-hub/check_portfolio.py
      - name: Unit tests
        run: python -m unittest discover -s portfolio/recruiter-hub/tests -v
