name: FRANKENSTEIN Finance Ops Audit Tests

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "NAAIL-OpenLab/audit_agents/frankenstein_finops/**"
      - ".github/workflows/frankenstein_finops_audit.yml"
  pull_request:
    paths:
      - "NAAIL-OpenLab/audit_agents/frankenstein_finops/**"
      - ".github/workflows/frankenstein_finops_audit.yml"

jobs:
  frankenstein-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r NAAIL-OpenLab/audit_agents/frankenstein_finops/requirements.txt

      - name: Compile specialist programme
        run: python -m compileall -q NAAIL-OpenLab/audit_agents/frankenstein_finops

      - name: Import orchestration stack
        working-directory: NAAIL-OpenLab/audit_agents
        run: python -c "import frankenstein_finops.agent; print('NAAIL FRANKENSTEIN import OK')"

      - name: Deterministic CLI smoke test
        working-directory: NAAIL-OpenLab/audit_agents
        run: python -m frankenstein_finops.cli --deterministic-only > /tmp/frankenstein_naail_report.json

      - name: Run unit tests
        working-directory: NAAIL-OpenLab/audit_agents
        run: python -m pytest -q frankenstein_finops/tests
