name: Open Data Hub Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - "open-source/accounting-finance-audit/data/**"
      - ".github/workflows/open-data-hub-smoke.yml"
  pull_request:
    paths:
      - "open-source/accounting-finance-audit/data/**"
      - ".github/workflows/open-data-hub-smoke.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight validation dependencies
        run: python -m pip install PyYAML
      - name: Validate registry and downloader syntax
        run: |
          python -m py_compile open-source/accounting-finance-audit/data/download_data.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          p = Path("open-source/accounting-finance-audit/data/data_sources.yml")
          doc = yaml.safe_load(p.read_text())
          ids = [x["id"] for x in doc["sources"]]
          assert len(ids) == len(set(ids)), "duplicate source ids"
          assert {"huggingface","kaggle","github"} <= {x["platform"] for x in doc["sources"]}
          print(f"validated {len(ids)} registered sources")
          PY
