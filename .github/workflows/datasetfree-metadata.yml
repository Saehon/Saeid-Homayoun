name: DATASETFREE metadata validation
on:
  push:
    paths:
      - "DATASETFREE/**"
      - ".github/workflows/datasetfree-metadata.yml"
  pull_request:
    paths:
      - "DATASETFREE/**"
      - ".github/workflows/datasetfree-metadata.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public data registries
        run: python DATASETFREE/tools/validate_catalog.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s DATASETFREE/tests -v
