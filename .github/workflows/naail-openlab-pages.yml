name: Publish NAAIL OpenLab

on:
  push:
    branches: [main]
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail-openlab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload NAAIL OpenLab
        uses: actions/upload-pages-artifact@v4
        with:
          path: './NAAIL-OpenLab'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
