name: NAAIL official SEC XBRL and as-filed SIC pilot
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/naail-sec-official-xbrl.yml"
      - "NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/join_official_SEC_financial_quarters.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  as-filed-SEC-GAAP:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Install public financial statement parsing dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas==2.2.3
      - name: Download exact immutable 2025 Q1 and 2026 Q1 official SEC quarterly XBRL tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SEC-FS"
          for QUARTER in 2025q1 2026q1; do
            curl -fL --retry 4 --retry-delay 10 --connect-timeout 25 --max-time 1800               "https://www.sec.gov/files/dera/data/financial-statement-data-sets/${QUARTER}.zip"               -H "User-Agent: NAAIL OpenLab Academic Research research-office@example.org"               -o "$RUNNER_TEMP/SEC-FS/${QUARTER}.zip"
            unzip -t "$RUNNER_TEMP/SEC-FS/${QUARTER}.zip" | tail -2
          done
      - name: Match issuer original 10-K accession, contemporaneous SIC and US GAAP facts
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50
          python "$PROJECT/sampling/join_official_SEC_financial_quarters.py"             --zip "$RUNNER_TEMP/SEC-FS/2025q1.zip" "$RUNNER_TEMP/SEC-FS/2026q1.zip"             --originals "$PROJECT/sampling/actual_sec_historical_2026-09-30/SEC_10K_FY2017_2025_UNIVERSE.csv"             --out "$PROJECT/sampling/actual_sec_official_xbrl_pilot_2026-10-10"
      - uses: actions/upload-artifact@v4
        with:
          name: naail-sec-official-asfiled-sic-xbrl-pilot
          path: NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/actual_sec_official_xbrl_pilot_2026-10-10/
          retention-days: 90
      - name: Save original SEC filings-derived pilot files in the current draft research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/actual_sec_official_xbrl_pilot_2026-10-10/
          if ! git diff --staged --quiet; then
            git commit -m "SEC official quarterly 10-K matched GAAP facts and historic as-filed SIC pilot"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
