name: NAAIL Core Boundary Invariant

on:
  push:
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail_core_boundary_invariant.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail_core_boundary_invariant.yml'

permissions:
  contents: read

jobs:
  core-boundary-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Validate frozen Knowledge/RAG Core boundary
        run: pytest -q NAAIL-OpenLab/tests/test_core_boundary_invariant.py
