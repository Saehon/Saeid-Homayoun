name: NAAIL Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "NAAIL-OpenLab/**"
      - "AGENTS.md"
      - ".github/workflows/codex-review.yml"

# This workflow is intentionally conservative because the repository is public.
# Codex reviews NAAIL changes but does not modify repository files.

jobs:
  codex_review:
    name: Codex Review — NAAIL OpenLab
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Review NAAIL with OpenAI Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: "drop-sudo"
          working-directory: "NAAIL-OpenLab"
          prompt: |
            You are the automated code reviewer for NAAIL OpenLab.

            First read and follow both instruction files when present:
            - ../AGENTS.md
            - AGENTS.md

            This is pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Review ONLY the changes introduced by this pull request. Use the
            repository history and diff between these commits:

              Base: ${{ github.event.pull_request.base.sha }}
              Head: ${{ github.event.pull_request.head.sha }}

            Focus on NAAIL OpenLab and its specialist agents, including KIWI,
            POMELO, VERA, ECONOVA-S, IFRS Agent, PCAOB Agent, ICFR/TimesFM,
            Research Lab, Audit Agent Lab, and Student Lab.

            Apply the following review gates:

            1. Correctness
               - bugs, broken logic, invalid imports, runtime failures
               - incorrect paths, schemas, interfaces, or agent contracts

            2. NAAIL architecture governance
               - NAAIL OpenLab remains the top-level umbrella architecture
               - specialist agents are modules, not competing top-level systems
               - preserve the two permanent cores where applicable:
                 Knowledge Core and Technology Core

            3. Research reproducibility
               - data provenance and sample construction
               - deterministic seeds where relevant
               - documented transformations and variable construction
               - reproducible empirical outputs

            4. Accounting, auditing, and empirical-method integrity
               - temporal leakage / look-ahead bias
               - train/test contamination
               - incorrect fiscal-period alignment
               - unsupported causal claims
               - specification, measurement, or statistical errors
               - CAM/KAM, ICFR, IFRS, PCAOB, ESG, XBRL, or SEC-data mistakes

            5. Security and data governance
               - exposed secrets, API keys, credentials, tokens, or private URLs
               - accidental inclusion of proprietary/confidential datasets
               - unsafe external commands or untrusted-input handling

            6. Software quality
               - missing or inadequate tests
               - fragile error handling
               - unnecessary duplication
               - documentation inconsistent with implementation

            7. Scientific governance
               - evidence before claims
               - falsification and adversarial review where relevant
               - human approval before scientific-discovery claims

            Return a concise review organized as:

            ## NAAIL Codex Review
            ### Critical / High-priority findings
            ### Medium / Low-priority findings
            ### Reproducibility & research-integrity checks
            ### NAAIL architecture checks
            ### Recommended fixes
            ### Verdict

            For each finding, identify the relevant file and line/range when
            possible. Do not edit files. If no material issues are found, say
            so explicitly and still report the reproducibility, security, and
            architecture checks performed.

  post_review:
    name: Publish Codex Review
    runs-on: ubuntu-latest
    needs: codex_review
    if: needs.codex_review.outputs.final_message != ''

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post Codex review to pull request
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex_review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
