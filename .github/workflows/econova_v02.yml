name: ECONOVA-S v0.2 Tests
on:
  push:
    paths: ["prototype_v02/**"]
  pull_request:
    paths: ["prototype_v02/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype_v02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
