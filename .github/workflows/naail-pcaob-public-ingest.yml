name: NAAIL PCAOB public inspections schema + auditor match
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/naail-pcaob-public-ingest.yml"
      - "NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/inspect_pcaob_public_datasets.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-pcaob-official:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Download OFFICIAL public PCAOB inspections and Part I.A, Part I.B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pc"
          curl -fL --retry 3 --connect-timeout 25 --max-time 180 'https://pcaobus.org/docs/default-source/generated-reports/inspecton-reports-csv.csv?download=true&sfvrsn=1cadcbfa_1193' -o "$RUNNER_TEMP/pc/firms.csv"
          curl -fL --retry 3 --connect-timeout 25 --max-time 180 'https://pcaobus.org/docs/default-source/generated-reports/part-i-a-flat-file-%28csv%29.csv?download=true&sfvrsn=c59cce67_5' -o "$RUNNER_TEMP/pc/a.csv"
          curl -fL --retry 3 --connect-timeout 25 --max-time 180 'https://pcaobus.org/docs/default-source/generated-reports/part-i-b-flat-file-%28csv%29.csv?download=true&sfvrsn=68eeaca9_5' -o "$RUNNER_TEMP/pc/b.csv"
          file "$RUNNER_TEMP/pc/"*.csv
          wc -c "$RUNNER_TEMP/pc/"*.csv
      - name: Inspect exact schema and registered auditor name matches
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50
          python "$PROJECT/sampling/inspect_pcaob_public_datasets.py"            "$RUNNER_TEMP/pc/firms.csv" "$RUNNER_TEMP/pc/a.csv" "$RUNNER_TEMP/pc/b.csv"            "$PROJECT/sampling/actual_pcaob_public_2026-10-10"
      - name: Artifacts PCAOB
        uses: actions/upload-artifact@v4
        with:
          name: naail-pcaob-official-public-20261010
          path: NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/actual_pcaob_public_2026-10-10/
          retention-days: 90
      - name: Commit source-backed results to draft PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/actual_pcaob_public_2026-10-10/
          if ! git diff --staged --quiet; then
            git commit -m "Record official PCAOB inspection Part I.A/B facts, schemas and auditor name candidates"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
