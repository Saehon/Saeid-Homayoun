name: Kaggle Kernel Status Check

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "Kaggle kernel in owner/slug format"
        required: false
        default: "sadhon/sec-edgar-microsoft-10-k-simple-example"
  push:
    paths:
      - ".github/workflows/kaggle-kernel-status.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Wait for Kaggle kernel result
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL: ${{ github.event.inputs.kernel || 'sadhon/sec-edgar-microsoft-10-k-simple-example' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            echo "Status check attempt ${attempt}: ${KERNEL}"
            output="$(kaggle kernels status "${KERNEL}" 2>&1 || true)"
            echo "${output}"
            normalized="$(printf '%s' "${output}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${normalized}" == *"complete"* ]]; then
              echo "Kaggle kernel completed successfully."
              exit 0
            fi
            if [[ "${normalized}" == *"error"* ]] || [[ "${normalized}" == *"failed"* ]] || [[ "${normalized}" == *"cancel"* ]]; then
              echo "Kaggle kernel did not complete successfully."
              exit 1
            fi
            sleep 10
          done
          echo "Kernel did not reach a terminal state during the check window."
          exit 1
