name: Codex Portfolio Review v3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/CODEX_PORTFOLIO_REVIEW_REQUEST.md"
      - ".github/workflows/codex-portfolio-review-v2.yml"

# Read-only audit of every public repository currently in the Saehon account.
# Private repositories are intentionally excluded because a repository-scoped
# Actions token cannot safely clone unrelated private repositories.

jobs:
  portfolio_review:
    name: Codex Review — Saehon Public Portfolio
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prefetch complete public portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portfolio
          repos=(
            "Saeid-Homayoun"
            "AAA"
            "yfinance"
            "Google-Antigravity-using-a-multi-agent-BERT-architecture"
            "Financial-Sentiment-Analysis-and-Classification-Deep-Learning-Models"
            "agent-openai-python-banking-assistant"
            "AuditData-API"
            "artificial-analysis-intelligence-index"
            "IFRS-AI-Inspector"
            "robosystems"
            "ganlab"
            "fg-data-synthetic"
            "timesfm"
            "openai-agents-python"
            "sec-edgar-downloader"
            "openesef"
            "esef-website"
            "Saeid-Homayoun-Test"
          )

          for repo in "${repos[@]}"; do
            echo "Cloning Saehon/${repo}"
            git clone --depth 1 --filter=blob:none               "https://github.com/Saehon/${repo}.git"               "portfolio/${repo}"
          done

          printf '%s\n' "${repos[@]}" > portfolio/REPOSITORIES_REVIEWED.txt
          test "$(wc -l < portfolio/REPOSITORIES_REVIEWED.txt)" -eq 18

      - name: Preflight — verify OpenAI API key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured. Add it in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          echo "OPENAI_API_KEY is configured."

      - name: Run Codex portfolio audit
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: portfolio
          permission-profile: ":read-only"
          safety-strategy: "drop-sudo"
          allow-users: "Saehon"
          allow-bot-users: "chatgpt-codex-connector"
          prompt: |
            Perform a read-only audit of every repository directory under the
            current workspace. REPOSITORIES_REVIEWED.txt must contain exactly
            18 public repositories; report any missing directory as a critical
            coverage failure.

            Read each repository's AGENTS.md and relevant README/license files.

            GOVERNANCE
            - Saehon/Saeid-Homayoun is the canonical public research repository.
            - Do not infer authorship or ownership merely because a repository
              exists under the Saehon account.
            - Distinguish original/custom work from upstream forks, imported
              examples, dependencies and reference repositories.
            - Preserve upstream licenses and attribution.
            - Do not infer endorsement, partnership, patent status, empirical
              success or real-company audit findings without evidence.

            REVIEW EACH REPOSITORY FOR
            1. purpose and relationship to the canonical repository;
            2. README/license/citation/contributing/changelog/AGENTS hygiene;
            3. code structure and maintainability;
            4. tests and CI coverage;
            5. secrets, unsafe examples, dependency and data-governance risks;
            6. reproducibility, seeds, environments and data provenance;
            7. temporal leakage, train/test contamination and unsupported causality;
            8. IFRS/PCAOB/SEC provenance, CAM/KAM fiscal alignment, ICFR labels,
               XBRL mapping and evidence traceability where applicable;
            9. Codex/CI readiness;
            10. classification as CORE PRODUCT, RESEARCH PROJECT,
                EDUCATION/DEMO, DATA/DEPENDENCY, UPSTREAM/REFERENCE, ARCHIVE,
                TEST/UTILITY or CONSOLIDATE/RETIRE.

            PORTFOLIO-WIDE CHECKS
            - stale or duplicate repositories;
            - conflicting architecture/product naming;
            - licensing, citation, attribution and IP inconsistencies;
            - default-branch inconsistency;
            - missing tests/CI;
            - reusable components that should be consolidated;
            - claims that exceed executable evidence;
            - human-approval boundaries for professional or scientific claims.

            Produce exactly:
            # Codex Portfolio Review — Saehon
            ## Executive summary
            ## Coverage check
            ## Critical findings
            ## Repository-by-repository matrix
            ## Security and data-governance findings
            ## Reproducibility and research-integrity findings
            ## Architecture and product-governance findings
            ## Fork/provenance and licensing findings
            ## Codex/CI readiness
            ## Top 10 prioritized actions
            ## Keep / consolidate / archive / dependency recommendations
            ## Final status

            Cite concrete repository paths where possible. Do not edit files.

  publish_review:
    name: Publish Codex Portfolio Review
    runs-on: ubuntu-latest
    needs: portfolio_review
    if: needs.portfolio_review.outputs.final_message != ''

    permissions:
      issues: write

    steps:
      - name: Publish review as GitHub issue
        uses: actions/github-script@v9
        env:
          CODEX_REVIEW: ${{ needs.portfolio_review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.CODEX_REVIEW || 'Codex returned no review text.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Codex Portfolio Review — ${new Date().toISOString().slice(0, 10)}`,
              body: body.slice(0, 65000)
            });
