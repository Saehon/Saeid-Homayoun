name: NAAIL Research Assurance P7

on:
  workflow_dispatch:
  push:
    paths:
      - "NAAIL/research-assurance-mcp/p5/**"
      - "NAAIL/research-assurance-mcp/p7/**"
      - "NAAIL/research-assurance-mcp/evidence-graph/**"
      - "NAAIL/research-assurance-mcp/benchmark/**"
      - "NAAIL/research-assurance-mcp/derived/claude_2026-10-02/**"
      - "NAAIL/research-assurance-mcp/derived/derived_claude_2026-10-02_p2.zip"
      - ".github/workflows/naail_research_assurance_p7.yml"

jobs:
  p7-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run P7 integration harness
        run: python NAAIL/research-assurance-mcp/p7/test_poc_integration.py

      - name: Run Claude P7 regression v2
        run: python NAAIL/research-assurance-mcp/derived/claude_2026-10-02/p7_regression_v2.py NAAIL/research-assurance-mcp NAAIL/research-assurance-mcp/derived/claude_2026-10-02

      - name: Run executable P2 adversarial benchmark
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/naail-p2"
          mkdir -p "$RUNNER_TEMP/naail-p2"
          unzip -q NAAIL/research-assurance-mcp/derived/derived_claude_2026-10-02_p2.zip -d "$RUNNER_TEMP/naail-p2"
          python "$RUNNER_TEMP/naail-p2/derived_claude_2026-10-02/p2_executable/p2_adversarial_v2_executable.py" NAAIL/research-assurance-mcp
