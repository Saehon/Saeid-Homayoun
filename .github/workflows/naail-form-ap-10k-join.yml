name: NAAIL exact PCAOB Form AP SEC 10-K auditor CIK-fiscal-end join
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/naail-form-ap-10k-join.yml"
      - "NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50/sampling/join_form_ap_to_sec_historical_10k.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-form-ap-issuer-auditor-match:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install basic data parsing
        run: python -m pip install --disable-pip-version-check pandas==2.2.3
      - name: Retrieve verified original 2017–2025 SEC CIK, FYE and accession dates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SECHIST"
          gh run download 38085610261 --repo Saehon/Saeid-Homayoun --name naail-sec-historical-sample-fy2021-2024 --dir "$RUNNER_TEMP/SECHIST"
          test -s "$RUNNER_TEMP/SECHIST/SEC_10K_FY2017_2025_UNIVERSE.csv"
      - name: Download official full PCAOB AuditorSearch Form AP filing data
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 8 --max-time 900 \
            "https://assets.pcaobus.org/firm-filings/FirmFilings.zip" \
            -o "$RUNNER_TEMP/FirmFilings.zip"
          unzip -t "$RUNNER_TEMP/FirmFilings.zip" | tail -2
          sha256sum "$RUNNER_TEMP/FirmFilings.zip"
      - name: Match exact CIK plus fiscal period end from issuer 10-K to auditor firm registry
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=NAAIL-OpenLab/projects/NAAIL-AI-CapEx-ICFR-Damodaran-FT50
          python "$PROJECT/sampling/join_form_ap_to_sec_historical_10k.py" \
            --history "$RUNNER_TEMP/SECHIST/SEC_10K_FY2017_2025_UNIVERSE.csv" \
            --form-ap-zip "$RUNNER_TEMP/FirmFilings.zip" \
            --out "$RUNNER_TEMP/FORM_AP_10K_LINK"
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"FORM_AP_10K_LINK/FORMAP_SEC_JOIN_ACTUAL_COVERAGE_QA_2026-10-10.json"
          d=json.loads(p.read_text())
          assert d["FY2021_2024_unique_10K_CIK_fy_matched"]>2500,d
          assert d["FY2021_2024_unique_registered_audit_firms"]>10,d
          print("EXACT_AUDITOR_ISSUER_FORM_AP_MATCH_PASSED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naail-official-form-ap-sec-issuer-auditor-2021-2025
          path: ${{ runner.temp }}/FORM_AP_10K_LINK/
          retention-days: 90
          if-no-files-found: error
