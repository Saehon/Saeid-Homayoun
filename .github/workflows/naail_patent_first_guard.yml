name: NAAIL Patent-First Public Disclosure Guard

on:
  push:
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail_patent_first_guard.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/**'
      - '.github/workflows/naail_patent_first_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patent-first-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Verify private patent path is not public
        shell: bash
        run: |
          if [ -d "NAAIL-OpenLab/private/patent" ]; then
            echo "ERROR: private/patent must not exist in the public NAAIL repository."
            exit 1
          fi

      - name: Run patent-first integrity tests
        run: |
          python -m pytest -q \
            NAAIL-OpenLab/tests/test_patent_first_public_boundary.py \
            NAAIL-OpenLab/tests/test_decision_consequence_engine.py \
            NAAIL-OpenLab/tests/test_data_evidence_mesh_registry.py \
            NAAIL-OpenLab/tests/test_business_school_digital_twin_architecture.py \
            NAAIL-OpenLab/tests/test_platform_capability_registry.py \
            NAAIL-OpenLab/tests/test_core_boundary_invariant.py
