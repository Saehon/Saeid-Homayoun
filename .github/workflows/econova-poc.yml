name: ECONOVA-S POC

on:
  push:
    paths: ['poc/**', '.github/workflows/econova-poc.yml']
  pull_request:
    paths: ['poc/**', '.github/workflows/econova-poc.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r poc/requirements.txt
      - run: python poc/econova_poc.py
      - run: pytest -q poc/tests
