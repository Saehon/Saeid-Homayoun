name: Microsoft POC V1 Fama-French FY2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NAAIL-OpenLab/prototypes/microsoft-poc-v1/code/msft_fama_french_fy2026.py'
      - 'NAAIL-OpenLab/prototypes/microsoft-poc-v1/microsoft_fama_french_fy2026_input.csv'
      - '.github/workflows/microsoft_poc_v1_fama_french.yml'

permissions:
  contents: write

jobs:
  execute-fama-french:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas statsmodels

      - name: Execute bounded FY2026 Fama-French validation
        working-directory: NAAIL-OpenLab/prototypes/microsoft-poc-v1
        run: python code/msft_fama_french_fy2026.py

      - name: Verify generated artifacts
        working-directory: NAAIL-OpenLab/prototypes/microsoft-poc-v1
        run: |
          test -s MICROSOFT_FAMA_FRENCH_FY2026.md
          test -s microsoft_fama_french_fy2026_merged.csv
          test -s microsoft_fama_french_results.csv
          test -s microsoft_fama_french_provenance.json
          grep -q 'EXECUTED_BOUNDED_MONTHLY_FF5' MICROSOFT_FAMA_FRENCH_FY2026.md

      - name: Commit executed results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            NAAIL-OpenLab/prototypes/microsoft-poc-v1/MICROSOFT_FAMA_FRENCH_FY2026.md \
            NAAIL-OpenLab/prototypes/microsoft-poc-v1/microsoft_fama_french_fy2026_merged.csv \
            NAAIL-OpenLab/prototypes/microsoft-poc-v1/microsoft_fama_french_results.csv \
            NAAIL-OpenLab/prototypes/microsoft-poc-v1/microsoft_fama_french_provenance.json
          if git diff --cached --quiet; then
            echo 'No Fama-French result changes to commit.'
          else
            git commit -m 'research: execute Microsoft FY2026 Fama-French validation [skip ci]'
            git push
          fi
