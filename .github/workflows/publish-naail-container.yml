name: Publish NAAIL Container

on:
  push:
    branches: [main]
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
      - ".github/workflows/publish-naail-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/naail-openlab

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run scientific-integrity contract tests
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: |
          python -m unittest discover -s tests -v
          python prototype003.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate package metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=0.2.3
            type=sha

      - name: Build and publish NAAIL container
        uses: docker/build-push-action@v6
        with:
          context: NAAIL-OpenLab/Prototype_003/runtime
          file: NAAIL-OpenLab/Prototype_003/runtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
