name: NAAIL Nobel Theory Engine Guard

on:
  push:
    paths:
      - 'README.md'
      - 'NAAIL-OpenLab/README.md'
      - 'NAAIL-OpenLab/00_START_HERE.md'
      - 'NAAIL-OpenLab/PUBLIC_PLATFORM_OVERVIEW.md'
      - 'NAAIL-OpenLab/NOBEL_THEORY_TO_EVIDENCE_AI_EXPERIMENT_ENGINE.md'
      - 'NAAIL-OpenLab/architecture/MASTER_PLATFORM_HIERARCHY.md'
      - 'NAAIL-OpenLab/architecture/platform_capability_registry.json'
      - 'NAAIL-OpenLab/architecture/PLATFORM_CAPABILITY_MATRIX.md'
      - 'NAAIL-OpenLab/tests/test_nobel_theory_engine.py'
      - 'NAAIL-OpenLab/tests/test_public_platform_overview.py'
      - '.github/workflows/naail_nobel_theory_engine_guard.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'NAAIL-OpenLab/README.md'
      - 'NAAIL-OpenLab/00_START_HERE.md'
      - 'NAAIL-OpenLab/PUBLIC_PLATFORM_OVERVIEW.md'
      - 'NAAIL-OpenLab/NOBEL_THEORY_TO_EVIDENCE_AI_EXPERIMENT_ENGINE.md'
      - 'NAAIL-OpenLab/architecture/MASTER_PLATFORM_HIERARCHY.md'
      - 'NAAIL-OpenLab/architecture/platform_capability_registry.json'
      - 'NAAIL-OpenLab/architecture/PLATFORM_CAPABILITY_MATRIX.md'
      - 'NAAIL-OpenLab/tests/test_nobel_theory_engine.py'
      - 'NAAIL-OpenLab/tests/test_public_platform_overview.py'
  workflow_dispatch:

jobs:
  nobel-theory-engine-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run Nobel Theory Engine and public-platform guards
        run: |
          python -m pytest NAAIL-OpenLab/tests/test_nobel_theory_engine.py -q
          python -m pytest NAAIL-OpenLab/tests/test_public_platform_overview.py -q
