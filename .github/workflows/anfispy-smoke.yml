name: ANFISpy smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/anfispy/**"
      - ".github/workflows/anfispy-smoke.yml"
  pull_request:
    paths:
      - "tools/anfispy/**"
      - ".github/workflows/anfispy-smoke.yml"

jobs:
  anfispy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ANFISpy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/anfispy/requirements.txt

      - name: Verify import
        run: python tools/anfispy/verify_anfispy.py
