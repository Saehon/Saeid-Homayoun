name: Lemon ICFR tests

on:
  pull_request:
    paths:
      - "Lemon-ICFR-US/**"
      - ".github/workflows/lemon-icfr-tests.yml"
  push:
    branches: [main]
    paths:
      - "Lemon-ICFR-US/**"
      - ".github/workflows/lemon-icfr-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lemon-ICFR-US
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
