name: ECONOVA-S v0.3 Data Tests

on:
  push:
    paths:
      - "prototype_v03/**"
      - ".github/workflows/econova_v03.yml"
  pull_request:
    paths:
      - "prototype_v03/**"
      - ".github/workflows/econova_v03.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype_v03
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: prototype_v03/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall econova tests
      - run: pytest -q
