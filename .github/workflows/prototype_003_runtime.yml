name: Prototype 003 Runtime

on:
  push:
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
      - ".github/workflows/prototype_003_runtime.yml"
  pull_request:
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Prototype 003 tests
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python -m unittest discover -s tests -v

      - name: Run frozen benchmark
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python prototype003.py

      - name: Validate benchmark output
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/latest_results.json")
          assert p.exists(), "Benchmark output missing"
          result = json.loads(p.read_text())
          assert len(result["runs"]) == 4
          assert "NO_SUPERIORITY_CLAIM" in result["research_claim"]
          for row in result["runs"].values():
              assert row["artifact"]["human_gate"] == "PENDING_HUMAN_APPROVAL"
              assert row["metrics"]["unsupported_discovery_claim"] is False
          print("Prototype 003 CI governance gate passed")
          PY
