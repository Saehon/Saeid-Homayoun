name: Prototype 003 Runtime

on:
  push:
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
      - ".github/workflows/prototype_003_runtime.yml"
  pull_request:
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Prototype 003 tests
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python -m unittest discover -s tests -v

      - name: Run public deterministic checkpoint
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python prototype003.py

      - name: Validate scientific-integrity output
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("outputs/latest_results.json")
          assert p.exists(), "Benchmark output missing"
          result = json.loads(p.read_text())
          assert result["public_release"] == "0.2.3"
          assert len(result["case_registry"]) == 3
          assert "NO_SUPERIORITY_CLAIM" in result["research_claim"]

          deterministic = result["runs"]["deterministic"]
          assert deterministic["artifact"]["execution_status"] == "EXECUTED"
          assert deterministic["artifact"]["human_gate"] == "PENDING_HUMAN_APPROVAL"
          assert deterministic["metrics"]["unsupported_discovery_claim"] is False

          for architecture in ("single_agent", "sequential_agents", "governed_multi_agent"):
              row = result["runs"][architecture]
              assert row["execution_status"] == "NOT_EXECUTED_PROVIDER_REQUIRED"
              assert row["provider"] is None
              assert row["model"] is None
              assert row["exceptions"] is None
              assert row["metrics"] is None

          print("Prototype 003 CI scientific-integrity gate passed")
          PY
