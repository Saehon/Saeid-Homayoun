name: Prototype 003 Runtime + Prototype 004 Providers

on:
  push:
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
      - ".github/workflows/prototype_003_runtime.yml"
  pull_request:
    paths:
      - "NAAIL-OpenLab/Prototype_003/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run public contract tests
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python -m unittest discover -s tests -v

      - name: Run public deterministic checkpoint
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python prototype003.py

      - name: Validate scientific-integrity output
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/latest_results.json")
          assert p.exists(), "Benchmark output missing"
          result = json.loads(p.read_text())
          assert result["public_release"] == "0.2.3"
          assert len(result["case_registry"]) == 3
          assert "NO_SUPERIORITY_CLAIM" in result["research_claim"]
          deterministic = result["runs"]["deterministic"]
          assert deterministic["artifact"]["execution_status"] == "EXECUTED"
          assert deterministic["artifact"]["human_gate"] == "PENDING_HUMAN_APPROVAL"
          for architecture in ("single_agent", "sequential_agents", "governed_multi_agent"):
              assert result["runs"][architecture]["execution_status"] == "NOT_EXECUTED_PROVIDER_REQUIRED"
          print("Prototype 003 scientific-integrity gate passed")
          PY

  gemini-provider:
    needs: frozen-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install provider dependencies
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python -m pip install -r requirements-providers.txt

      - name: Run Gemini Prototype 004 comparison or record missing credentials
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python provider_runner.py --provider gemini --architecture all --allow-missing --out outputs/provider_gemini.json

      - name: Validate Gemini provider artifact
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("outputs/provider_gemini.json").read_text())
          if result.get("execution_status") == "NOT_EXECUTED_PROVIDER_REQUIRED":
              assert "GEMINI_API_KEY" in result["missing_configuration"]
              print("Gemini credentials absent: scientific-integrity skip recorded")
          else:
              assert result["provider"] == "google_gemini"
              assert result["human_gate"] == "PENDING_HUMAN_APPROVAL"
              assert set(result["runs"]) == {"single_agent", "sequential_agents", "governed_multi_agent"}
              for row in result["runs"].values():
                  assert row["artifact"]["execution_status"] == "EXECUTED_REAL_PROVIDER"
                  assert row["artifact"]["human_gate"] == "PENDING_HUMAN_APPROVAL"
              print("Gemini real-provider comparison completed")
          PY

      - name: Upload Gemini result
        uses: actions/upload-artifact@v4
        with:
          name: prototype-004-gemini
          path: NAAIL-OpenLab/Prototype_003/runtime/outputs/provider_gemini.json
          if-no-files-found: error

  microsoft-foundry-provider:
    needs: frozen-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_INFERENCE_ENDPOINT: ${{ secrets.AZURE_INFERENCE_ENDPOINT }}
      AZURE_INFERENCE_CREDENTIAL: ${{ secrets.AZURE_INFERENCE_CREDENTIAL }}
      AZURE_INFERENCE_MODEL: ${{ secrets.AZURE_INFERENCE_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install provider dependencies
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python -m pip install -r requirements-providers.txt

      - name: Run Microsoft Foundry Prototype 004 comparison or record missing credentials
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: python provider_runner.py --provider foundry --architecture all --allow-missing --out outputs/provider_foundry.json

      - name: Validate Microsoft Foundry provider artifact
        working-directory: NAAIL-OpenLab/Prototype_003/runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("outputs/provider_foundry.json").read_text())
          if result.get("execution_status") == "NOT_EXECUTED_PROVIDER_REQUIRED":
              assert result["missing_configuration"]
              print("Microsoft Foundry credentials absent: scientific-integrity skip recorded")
          else:
              assert result["provider"] == "microsoft_foundry"
              assert result["human_gate"] == "PENDING_HUMAN_APPROVAL"
              assert set(result["runs"]) == {"single_agent", "sequential_agents", "governed_multi_agent"}
              for row in result["runs"].values():
                  assert row["artifact"]["execution_status"] == "EXECUTED_REAL_PROVIDER"
                  assert row["artifact"]["human_gate"] == "PENDING_HUMAN_APPROVAL"
              print("Microsoft Foundry real-provider comparison completed")
          PY

      - name: Upload Microsoft Foundry result
        uses: actions/upload-artifact@v4
        with:
          name: prototype-004-microsoft-foundry
          path: NAAIL-OpenLab/Prototype_003/runtime/outputs/provider_foundry.json
          if-no-files-found: error
