name: NAAIL Finance Market Intelligence Registry

on:
  push:
    paths:
      - 'NAAIL-OpenLab/FINANCE_MARKET_INTELLIGENCE_LAB.md'
      - 'NAAIL-OpenLab/architecture/finance_open_source_registry.json'
      - 'NAAIL-OpenLab/tests/test_finance_open_source_registry.py'
      - '.github/workflows/naail_finance_market_intelligence.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/FINANCE_MARKET_INTELLIGENCE_LAB.md'
      - 'NAAIL-OpenLab/architecture/finance_open_source_registry.json'
      - 'NAAIL-OpenLab/tests/test_finance_open_source_registry.py'
      - '.github/workflows/naail_finance_market_intelligence.yml'

permissions:
  contents: read

jobs:
  validate-finance-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q NAAIL-OpenLab/tests/test_finance_open_source_registry.py
