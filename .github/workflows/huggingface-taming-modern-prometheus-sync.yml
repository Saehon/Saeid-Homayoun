name: Hugging Face - Taming the Modern Prometheus Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "open-data/taming-modern-prometheus/**"
      - "huggingface/datasets/taming-modern-prometheus/**"
      - ".github/workflows/huggingface-taming-modern-prometheus-sync.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Hugging Face authentication
        id: auth
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${HF_TOKEN}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::HF_TOKEN is not configured. Hugging Face publication is skipped."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.auth.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate benchmark
        if: steps.auth.outputs.configured == 'true'
        run: python open-data/taming-modern-prometheus/validate.py

      - name: Install Hugging Face Hub client
        if: steps.auth.outputs.configured == 'true'
        run: python -m pip install --upgrade huggingface_hub

      - name: Stage dataset card and files
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          rm -rf /tmp/taming-modern-prometheus
          mkdir -p /tmp/taming-modern-prometheus
          cp huggingface/datasets/taming-modern-prometheus/README.md /tmp/taming-modern-prometheus/README.md
          cp open-data/taming-modern-prometheus/agentic_assurance_benchmark.csv /tmp/taming-modern-prometheus/
          cp open-data/taming-modern-prometheus/provenance.json /tmp/taming-modern-prometheus/
          cp papers/taming-modern-prometheus/README.md /tmp/taming-modern-prometheus/GITHUB_SOURCE.md

      - name: Publish dataset
        if: steps.auth.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "SADHON/taming-modern-prometheus-assurance"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=repo_id, repo_type="dataset", private=False, exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="dataset",
              folder_path="/tmp/taming-modern-prometheus",
              commit_message="Publish Taming the Modern Prometheus benchmark",
          )
          print(f"Published https://huggingface.co/datasets/{repo_id}")
          PY
