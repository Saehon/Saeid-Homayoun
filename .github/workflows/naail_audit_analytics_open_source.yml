name: NAAIL Audit Analytics Open-Source Guard

on:
  push:
    paths:
      - 'NAAIL-OpenLab/AUDIT_ANALYTICS_OPEN_SOURCE_PACK.md'
      - 'NAAIL-OpenLab/architecture/audit_analytics_open_source_registry.json'
      - 'NAAIL-OpenLab/tests/test_audit_analytics_open_source_registry.py'
      - '.github/workflows/naail_audit_analytics_open_source.yml'
  pull_request:
    paths:
      - 'NAAIL-OpenLab/AUDIT_ANALYTICS_OPEN_SOURCE_PACK.md'
      - 'NAAIL-OpenLab/architecture/audit_analytics_open_source_registry.json'
      - 'NAAIL-OpenLab/tests/test_audit_analytics_open_source_registry.py'
      - '.github/workflows/naail_audit_analytics_open_source.yml'

jobs:
  audit-analytics-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q NAAIL-OpenLab/tests/test_audit_analytics_open_source_registry.py
