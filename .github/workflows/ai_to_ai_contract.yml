name: AI-to-AI Scientific Contract

on:
  push:
    paths:
      - "README.md"
      - "AI_TO_AI_AUTOMATION.md"
      - "automation/**"
      - ".github/workflows/ai_to_ai_contract.yml"
  pull_request:
    paths:
      - "README.md"
      - "AI_TO_AI_AUTOMATION.md"
      - "automation/**"
      - ".github/workflows/ai_to_ai_contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test and schema validators
        run: python -m pip install --upgrade pytest jsonschema
      - name: Compile automation runtime
        run: python -m py_compile automation/validate_handoff.py automation/orchestrator.py automation/test_orchestrator.py
      - name: Validate canonical sample handoff
        run: python automation/validate_handoff.py automation/sample_handoff.json
      - name: Test chained orchestration and failure containment
        run: python -m pytest -q automation/test_orchestrator.py
      - name: Run deterministic AI-to-AI governance demo
        run: python automation/orchestrator.py --question "When does data become information and economic value?" --output automation/artifacts/demo_chain.json
      - name: Enforce scientific safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          text = Path("AI_TO_AI_AUTOMATION.md").read_text(encoding="utf-8")
          assert "discovery_claim_allowed = false" in text
          assert "agent_consensus != scientific_truth" in text

          chain = json.loads(Path("automation/artifacts/demo_chain.json").read_text(encoding="utf-8"))
          assert chain["human_gate_required"] is True
          assert chain["human_gate_approved"] is False
          assert chain["agent_consensus_is_scientific_truth"] is False
          assert chain["discovery_claim_allowed"] is False
          assert chain["chain_length"] == 7
          print("Scientific automation invariants passed.")
          PY
      - name: Upload auditable automation trace
        uses: actions/upload-artifact@v4
        with:
          name: econova-ai-to-ai-demo-trace
          path: automation/artifacts/demo_chain.json
          retention-days: 30
