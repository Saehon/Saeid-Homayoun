name: Publish Risk-CAM public synthetic package
on:
  push:
    branches:
      - research/jar-risk-cam-publication-20261016
    paths:
      - '.github/workflows/publish-risk-cam-public.yml'
      - 'research/jev-ai-audit/jar-risk-cam/data/**'
      - 'research/jev-ai-audit/jar-risk-cam/distribution/**'
      - 'research/jev-ai-audit/jar-risk-cam/scripts/publish_*.py'
      - 'research/jev-ai-audit/jar-risk-cam/src/**'
      - 'research/jev-ai-audit/jar-risk-cam/tests/**'
      - 'research/jev-ai-audit/jar-risk-cam/JAR_Risk_CAM_Replication_Starter_2026-10-16.zip'
  workflow_dispatch:
    inputs:
      target:
        description: "Publication target"
        required: true
        type: choice
        options:
          - both
          - huggingface
          - kaggle
permissions:
  contents: read

jobs:
  huggingface:
    if: github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'huggingface'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face uploader
        run: python -m pip install "huggingface_hub>=0.26,<2"
      - name: Publish synthetic-only package to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: SADHON/darwin-jev-risk-cam-synthetic-replication
        run: python research/jev-ai-audit/jar-risk-cam/scripts/publish_huggingface.py

  kaggle:
    if: github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'kaggle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle uploader
        run: python -m pip install "kaggle>=1.6,<2"
      - name: Publish synthetic-only package to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python research/jev-ai-audit/jar-risk-cam/scripts/publish_kaggle.py
