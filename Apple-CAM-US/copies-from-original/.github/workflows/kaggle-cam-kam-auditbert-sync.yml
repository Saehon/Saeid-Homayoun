name: Kaggle - CAM KAM AuditBERT Demo Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "open-data/cam-kam-auditbert-demo-001/**"
      - "kaggle/datasets/cam-kam-auditbert-public-demo/**"
      - ".github/workflows/kaggle-cam-kam-auditbert-sync.yml"

permissions:
  contents: read

concurrency:
  group: kaggle-cam-kam-auditbert-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check Kaggle authentication
        id: auth
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${KAGGLE_API_TOKEN}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::error::KAGGLE_API_TOKEN is not configured."
            exit 1
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Validate canonical CAM/KAM demo
        run: python open-data/cam-kam-auditbert-demo-001/validate.py

      - name: Stage canonical data
        shell: bash
        run: |
          cp open-data/cam-kam-auditbert-demo-001/synthetic_cam_kam_sample.csv kaggle/datasets/cam-kam-auditbert-public-demo/
          cp open-data/cam-kam-auditbert-demo-001/provenance.json kaggle/datasets/cam-kam-auditbert-public-demo/

      - name: Publish private Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          DATASET_ID="sadhon/cam-kam-auditbert-public-demo"
          DIR="kaggle/datasets/cam-kam-auditbert-public-demo"
          kaggle datasets list -m -p 1 >/dev/null
          if kaggle datasets files "${DATASET_ID}" >/dev/null 2>&1; then
            kaggle datasets version -p "${DIR}" -m "Professional CAM/KAM AuditBERT sync ${GITHUB_SHA}"
          else
            kaggle datasets create -p "${DIR}"
          fi
          echo "Kaggle dataset: https://www.kaggle.com/datasets/${DATASET_ID}"
