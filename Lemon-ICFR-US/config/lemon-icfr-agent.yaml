product: Lemon-ICFR-US
version: "0.1-scientific-agent-architecture"
mode: research-and-education

domain:
  jurisdiction: US
  focus: Internal Control over Financial Reporting
  frameworks:
    - SOX-404
    - COSO
    - PCAOB-AS-2201
    - SEC-ICFR

evidence_priority:
  - SEC
  - PCAOB
  - COSO
  - company_primary_filings
  - reproducible_public_datasets
  - peer_reviewed_research
  - vendor_material

technology:
  provider_strategy: replaceable
  preferred_execution_layer:
    - claude_for_financial_services
    - financial_analysis_solution
    - claude_for_excel
    - claude_code
    - financial_services_agents

intelligence:
  systems_thinking: true
  co_scientist: true
  structure_discovery:
    inspiration: AlphaFold
    mode: hypothesis_only_until_validated
  evolutionary_improvement:
    inspiration: AlphaEvolve
    benchmark_gated: true
    autonomous_production_mutation: false
  scientific_discovery: true
  digital_twin: true
  causal_verification: true

agents:
  - lemon_orchestrator
  - scoping_risk_agent
  - coso_mapping_agent
  - control_design_agent
  - evidence_agent
  - operating_effectiveness_agent
  - financial_analysis_agent
  - deficiency_evaluation_agent
  - co_scientist_panel
  - structure_discovery_agent
  - reviewer_agent
  - falsification_agent

required_gates:
  - provenance
  - rights_license
  - icfr_coso_grounding
  - evidence_sufficiency
  - independent_review
  - falsification
  - reproducibility
  - human_approval

outputs:
  - evidence_passport
  - icfr_case_graph
  - test_results
  - contradiction_log
  - deficiency_candidate
  - human_disposition
  - model_lineage

governance:
  consequential_human_approval_required: true
  preserve_failures_and_contradictions: true
  no_ai_audit_opinion: true
  no_uncontrolled_self_improvement: true
  secrets_in_repository: false
