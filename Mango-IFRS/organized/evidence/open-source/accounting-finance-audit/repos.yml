version: 1
curated: "2026-09-25"
policy:
  vendor_source: false
  auto_execute_third_party: false
  preserve_upstream_license: true
  review_security_before_run: true

repositories:
  - provider: Microsoft
    repo: microsoft/FinanceBenchmark
    url: https://github.com/microsoft/FinanceBenchmark
    domains: [finance, accounting, AP, AR, agent-evaluation]
    tier: core
    free_assets: [benchmark, synthetic-data, code]
    runtime_note: "ERP path requires Dynamics 365/MCP; model providers may require credentials."
  - provider: Microsoft
    repo: microsoft/finance-advanced-analytics
    url: https://github.com/microsoft/finance-advanced-analytics
    domains: [finance, forecasting, analytics]
    tier: core
    free_assets: [code, learning-material]
  - provider: Microsoft
    repo: microsoft/dstoolkit-corporate-financial-forecasting
    url: https://github.com/microsoft/dstoolkit-corporate-financial-forecasting
    domains: [finance, forecasting]
    tier: optional
    free_assets: [code, templates]
    runtime_note: "Designed around Azure/Synapse."
  - provider: Microsoft
    repo: microsoft/CopilotStudioSamples
    url: https://github.com/microsoft/CopilotStudioSamples
    domains: [copilot, agents, MCP, testing]
    tier: core
    free_assets: [samples, templates]
    runtime_note: "Copilot Studio/Power Platform features may require account/licence."
  - provider: Microsoft-PnP
    repo: pnp/copilot-pro-dev-samples
    url: https://github.com/pnp/copilot-pro-dev-samples
    domains: [copilot, finance, financial-statements]
    tier: core
    free_assets: [samples]
    runtime_note: "Some samples require Azure/M365 resources."
  - provider: Microsoft
    repo: microsoft/qlib
    url: https://github.com/microsoft/qlib
    domains: [finance, quant, machine-learning]
    tier: optional
    free_assets: [code, data-collectors]
  - provider: IBM
    repo: IBM/AML-Data
    url: https://github.com/IBM/AML-Data
    domains: [finance, AML, fraud, synthetic-data]
    tier: core
    free_assets: [synthetic-data]
    runtime_note: "Dataset licence differs from repository code licence; see upstream."
  - provider: IBM
    repo: IBM/AMLSim
    url: https://github.com/IBM/AMLSim
    domains: [finance, AML, fraud, graph, synthetic-data]
    tier: core
    free_assets: [simulator, synthetic-data]
  - provider: IBM
    repo: IBM/TabFormer
    url: https://github.com/IBM/TabFormer
    domains: [finance, fraud, synthetic-data, transformer]
    tier: optional
    free_assets: [code, dataset]
  - provider: IBM
    repo: IBM/ai-on-z-fraud-detection
    url: https://github.com/IBM/ai-on-z-fraud-detection
    domains: [finance, fraud, deep-learning]
    tier: optional
    free_assets: [notebooks, models]
    runtime_note: "Older dependency stack; use primarily as reference/benchmark."
  - provider: IBM
    repo: IBM/watsonx-ai-samples
    url: https://github.com/IBM/watsonx-ai-samples
    domains: [watsonx, credit-risk, machine-learning]
    tier: optional
    free_assets: [notebooks, code]
    runtime_note: "Many executions require watsonx/Cloud Pak credentials."
  - provider: IBM
    repo: IBM/watsonx-developer-hub
    url: https://github.com/IBM/watsonx-developer-hub
    domains: [watsonx, agents, generative-ai]
    tier: optional
    free_assets: [samples, guides]
    runtime_note: "Runtime generally requires watsonx project/API values."
  - provider: IBM
    repo: ibm-client-engineering/output-drift-financial-llms
    url: https://github.com/ibm-client-engineering/output-drift-financial-llms
    domains: [finance, auditability, agent-evaluation, assurance]
    tier: core
    free_assets: [benchmark, assurance-harness]
  - provider: IBM
    repo: IBM/ai-agent-for-loan-risk
    url: https://github.com/IBM/ai-agent-for-loan-risk
    domains: [finance, credit-risk, agents]
    tier: optional
    free_assets: [code]
    runtime_note: "Intended deployment requires IBM Cloud/watsonx services."
  - provider: XBRL
    repo: Arelle/Arelle
    url: https://github.com/Arelle/Arelle
    domains: [accounting, XBRL, SEC, ESEF, validation]
    tier: core
    free_assets: [code]
  - provider: SEC
    repo: jadchaar/sec-edgar-downloader
    url: https://github.com/jadchaar/sec-edgar-downloader
    domains: [accounting, SEC, EDGAR, filings]
    tier: core
    free_assets: [code]
    runtime_note: "Use a compliant SEC user-agent and fair-access practices."
  - provider: Audit
    repo: westland/auditanalytics
    url: https://github.com/westland/auditanalytics
    domains: [audit, accounting, analytics, R]
    tier: core
    free_assets: [code, example-data]
  - provider: Audit-Research
    repo: GitiHubi/deepPaper
    url: https://github.com/GitiHubi/deepPaper
    domains: [audit, journal-entries, research]
    tier: optional
    free_assets: [research-index]
  - provider: ProsusAI
    repo: ProsusAI/finBERT
    url: https://github.com/ProsusAI/finBERT
    domains: [finance, NLP, sentiment]
    tier: core
    free_assets: [code, model-links]
  - provider: AI4Finance
    repo: AI4Finance-Foundation/FinGPT
    url: https://github.com/AI4Finance-Foundation/FinGPT
    domains: [finance, LLM, RAG, NLP]
    tier: core
    free_assets: [code, model-links, benchmark-links]

  - provider: Accounting-Agent
    repo: adoptai/cpa-skills
    url: https://github.com/adoptai/cpa-skills
    domains: [accounting, audit, reconciliation, journal-entries, sampling]
    tier: core
    free_assets: [code, agent-skills]
    licence: MIT
  - provider: Finance-Agent
    repo: GAJETOso/financeskills
    url: https://github.com/GAJETOso/financeskills
    domains: [finance, accounting, IFRS, GAAP, audit, compliance]
    tier: core
    free_assets: [code, agent-skills]
    licence: MIT
  - provider: Controls
    repo: esploro-group/closegate
    url: https://github.com/esploro-group/closegate
    domains: [SOX, segregation-of-duties, accounting, controls, human-in-the-loop]
    tier: core
    free_assets: [code, policy-gates]
    licence: Apache-2.0
  - provider: Document-AI
    repo: docling-project/docling-mcp
    url: https://github.com/docling-project/docling-mcp
    domains: [documents, evidence, MCP, accounting, audit]
    tier: core
    free_assets: [code, MCP-server]
    licence: MIT
  - provider: SEC-MCP
    repo: stefanoamorelli/sec-edgar-mcp
    url: https://github.com/stefanoamorelli/sec-edgar-mcp
    domains: [SEC, EDGAR, XBRL, MCP, accounting, finance]
    tier: core
    free_assets: [code, MCP-server]
    licence: AGPL-3.0
  - provider: Google
    repo: google/adk-python
    url: https://github.com/google/adk-python
    domains: [agents, multi-agent, orchestration]
    tier: optional
    free_assets: [code, agent-framework]
    licence: Apache-2.0
  - provider: Microsoft
    repo: microsoft/agent-framework
    url: https://github.com/microsoft/agent-framework
    domains: [agents, multi-agent, orchestration, copilot]
    tier: core
    free_assets: [code, agent-framework]
    licence: MIT
