# Candidate only — NOT ACTIVE.
# Human review required before copying to .github/workflows/.
name: NAAIL Research Assurance P7

on:
  workflow_dispatch:
  push:
    paths:
      - "NAAIL/research-assurance-mcp/p5/**"
      - "NAAIL/research-assurance-mcp/p7/**"
      - "NAAIL/research-assurance-mcp/evidence-graph/**"
      - "NAAIL/research-assurance-mcp/benchmark/**"
      - ".github/workflows/naail_research_assurance_p7.yml"

jobs:
  p7-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run P7 integration harness
        run: python NAAIL/research-assurance-mcp/p7/test_poc_integration.py
