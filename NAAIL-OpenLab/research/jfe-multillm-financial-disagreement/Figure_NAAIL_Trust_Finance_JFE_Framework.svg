<style>.title{font:700 46px Arial;fill:#0b2a4a}.sub{font:600 24px Arial;fill:#284c70}.h{font:700 24px Arial;fill:white}.b{font:18px Arial;fill:#17212b}.small{font:15px Arial;fill:#334}.box{fill:white;stroke:#c7d5e3;stroke-width:2}.navy{fill:#0b2a4a}.blue{fill:#eaf3fb}.green{fill:#eaf7ef}.amber{fill:#fff4dc}.pink{fill:#fdebec}.purple{fill:#f1edff}.arrow{font:700 38px Arial;fill:#1667a8}</style>
<rect width="1600" height="1000" fill="#f7f9fc"/>
<text x="800" y="62" text-anchor="middle" class="title">NAAIL Trust Finance — JFE Research Architecture</text>
<text x="800" y="100" text-anchor="middle" class="sub">Financial Evidence → Multi-LLM Analysis → AI Disagreement → Verification → Future Outcomes</text>
<g transform="translate(45,145)">
<rect class="box blue" x="0" y="0" width="250" height="280" rx="14"/><rect class="navy" x="0" y="0" width="250" height="48" rx="14"/><text x="125" y="32" text-anchor="middle" class="h">1. Evidence</text>
<text class="b" x="18" y="82"><tspan x="18">SEC 10-K / 10-Q</tspan><tspan x="18" dy="30">XBRL / EDGAR</tspan><tspan x="18" dy="30">Earnings / news</tspan><tspan x="18" dy="30">Audit reports / CAMs</tspan><tspan x="18" dy="30">ICFR / restatements</tspan><tspan x="18" dy="30">AAER / ESG / market data</tspan></text><text x="270" y="150" class="arrow">→</text>
<rect class="box green" x="320" y="0" width="250" height="280" rx="14"/><rect class="navy" x="320" y="0" width="250" height="48" rx="14"/><text x="445" y="32" text-anchor="middle" class="h">2. Multi-LLM</text>
<text class="b" x="340" y="82"><tspan x="340">GPT / OpenAI</tspan><tspan x="340" dy="34">Claude / Anthropic</tspan><tspan x="340" dy="34">Gemini / Google</tspan><tspan x="340" dy="34">Llama / open models</tspan><tspan x="340" dy="34">ChronoGPT / BERT</tspan></text><text x="590" y="150" class="arrow">→</text>
<rect class="box amber" x="640" y="0" width="250" height="280" rx="14"/><rect class="navy" x="640" y="0" width="250" height="48" rx="14"/><text x="765" y="32" text-anchor="middle" class="h">3. Judgments</text>
<text class="b" x="660" y="82"><tspan x="660">Sentiment / tone</tspan><tspan x="660" dy="30">Revenue risk</tspan><tspan x="660" dy="30">Tax / ICFR risk</tspan><tspan x="660" dy="30">Fraud / restatement</tspan><tspan x="660" dy="30">CAM/KAM / earnings</tspan></text><text x="910" y="150" class="arrow">→</text>
<rect class="box purple" x="960" y="0" width="250" height="280" rx="14"/><rect class="navy" x="960" y="0" width="250" height="48" rx="14"/><text x="1085" y="32" text-anchor="middle" class="h">4. AI Disagreement</text>
<text class="b" x="982" y="92"><tspan x="982">AIConsensus = mean(scores)</tspan><tspan x="982" dy="48">AID = SD(scores)</tspan><tspan x="982" dy="48">Pairwise disagreement</tspan><tspan x="982" dy="34">Sign / rank disagreement</tspan></text><text x="1230" y="150" class="arrow">→</text>
<rect class="box pink" x="1280" y="0" width="250" height="280" rx="14"/><rect class="navy" x="1280" y="0" width="250" height="48" rx="14"/><text x="1405" y="32" text-anchor="middle" class="h">5. Verification</text>
<text class="b" x="1300" y="82"><tspan x="1300">Source citations</tspan><tspan x="1300" dy="30">Chronology guard</tspan><tspan x="1300" dy="30">Falsification tests</tspan><tspan x="1300" dy="30">Model/version logging</tspan><tspan x="1300" dy="30">Human approval gate</tspan></text></g>
<g transform="translate(55,485)"><rect class="box" width="710" height="260" rx="14"/><rect class="navy" width="710" height="48" rx="14"/><text x="355" y="32" text-anchor="middle" class="h">Microsoft FY2026 — Simple Public-Data POC</text>
<text class="b" x="25" y="84"><tspan x="25">10-K filed: July 29, 2026</tspan><tspan x="25" dy="30">Auditor: Deloitte; ICFR opinion: unqualified</tspan><tspan x="25" dy="30">CAM 1: Revenue Recognition</tspan><tspan x="25" dy="30">CAM 2: Uncertain Tax Positions / Transfer Pricing</tspan></text>
<text class="b" x="390" y="84"><tspan x="390">Illustrative POC scores</tspan><tspan x="390" dy="32">Revenue 78 — HIGH</tspan><tspan x="390" dy="30">Tax 82 — HIGH</tspan><tspan x="390" dy="30">AI margin 55 — MEDIUM</tspan><tspan x="390" dy="30">ICFR 18 — LOW</tspan><tspan x="390" dy="30">Liquidity 22 — LOW</tspan></text></g>
<g transform="translate(805,485)"><rect class="box" width="740" height="260" rx="14"/><rect class="navy" width="740" height="48" rx="14"/><text x="370" y="32" text-anchor="middle" class="h">Proposed Journal of Financial Economics Contribution</text>
<text class="b" x="24" y="88"><tspan x="24">Question: Does disagreement among frontier LLMs contain incremental</tspan><tspan x="24" dy="28">information about future financial outcomes?</tspan></text>
<text class="b" x="24" y="165"><tspan x="24">Outcome(i,t+1) = α + β1 AIConsensus(i,t) + β2 AIDisagreement(i,t)</tspan><tspan x="24" dy="32">+ γ Controls + Firm FE + Time FE + ε</tspan></text></g>
