<text class="small" x="1020" y="78"><tspan x="1020">Outputs: Word manuscript, PNG/SVG figure, Microsoft POC,</tspan><tspan x="1020" dy="28">literature matrix, replication manifest, GitHub + Google Drive</tspan></text></g></svg>